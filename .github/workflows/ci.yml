name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # CI runners are disposable VMs, so tests that terminate real processes
  # may run there. Never set this on a workstation.
  VCA_PROCESS_CONTROL_TESTS: "1"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  shells:
    name: Tauri shells (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux WebView and audio libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libasound2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.os == 'ubuntu-latest' && 'aarch64-linux-android' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/ui/pnpm-lock.yaml
      # The shells embed the built UI at compile time.
      - name: Build the UI
        working-directory: apps/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path apps/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path apps/Cargo.toml --workspace --all-targets
      - name: Test
        run: cargo test --manifest-path apps/Cargo.toml --workspace
      - name: Check the Android library
        if: matrix.os == 'ubuntu-latest'
        run: |
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo clippy --manifest-path apps/Cargo.toml -p vca-mobile --target aarch64-linux-android
