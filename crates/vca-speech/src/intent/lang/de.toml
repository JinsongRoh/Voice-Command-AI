# German intent table. See en.toml for the format.
language = "de"

session_words = ["sitzung", "session", "terminal", "tab", "karte", "agent"]
current_words = ["diese", "dieses", "aktuelle", "aktuellen", "die hier"]
template_words = ["vorlage", "template", "makro"]
fillers = [
    "bitte", "die", "der", "das", "den", "dem", "zu", "zur", "zum", "nummer", "jetzt", "sofort",
    "mal", "kannst du", "könntest du", "hey", "ok", "okay", "wieder", "mir", "danke",
]

[actions]
