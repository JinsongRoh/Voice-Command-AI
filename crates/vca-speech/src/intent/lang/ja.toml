# Japanese intent table. See en.toml for the format.
language = "ja"

session_words = ["セッション", "ターミナル", "タブ", "カード", "エージェント"]
current_words = ["これ", "この", "今の", "現在の", "それ"]
template_words = ["テンプレート", "テンプレ", "マクロ"]
fillers = [
    "を", "に", "の", "は", "が", "へ", "で", "して", "してください", "ください", "下さい",
    "お願い", "お願いします", "て", "ね", "よ", "番", "番目", "ちょっと", "今すぐ", "すぐ",
    "して下さい", "しろ", "せよ", "する", "します", "って", "もう一度", "もう",
]

[actions]
select = ["切り替え", "切り替えて", "切替", "選択", "選んで", "開いて", "移動", "フォーカス"]
pause = ["一時停止", "ポーズ", "中断"]
resume = ["再開", "続行", "リジューム"]
stop = ["停止", "止めて", "止める", "終了", "ストップ", "キル", "強制終了"]
restart = ["再起動", "リスタート", "やり直し", "再実行"]
show_resources = ["リソース", "リソースを表示", "リソース使用量", "使用状況", "CPU使用率", "メモリ使用量", "負荷"]
approve = ["承認", "許可", "はい", "オッケー", "いいよ", "進めて"]
deny = ["拒否", "却下", "いいえ", "ダメ", "だめ", "許可しない"]
read_last_output = ["最後の出力を読んで", "最後の出力", "出力を読んで", "読み上げて", "結果を読んで", "何て言った"]
run_template = ["テンプレートを実行", "テンプレート実行", "テンプレートを使って", "テンプレを実行"]

[numbers]
"一番" = 1
"二番" = 2
"三番" = 3
"四番" = 4
"五番" = 5
"六番" = 6
"七番" = 7
"八番" = 8
"九番" = 9
"十番" = 10
"一つ目" = 1
"二つ目" = 2
"三つ目" = 3
"最初の" = 1
