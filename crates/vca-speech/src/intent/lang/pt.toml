# Portuguese intent table. See en.toml for the format.
language = "pt"

session_words = ["sessão", "sessao", "sessões", "terminal", "aba", "cartão", "agente"]
current_words = ["esta", "este", "atual", "essa"]
template_words = ["modelo", "template", "macro"]
