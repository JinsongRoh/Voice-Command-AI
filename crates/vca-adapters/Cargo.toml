[package]
name = "vca-adapters"
description = "Local coding agent adapters and terminal input injection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
dirs = "7.0.0"
futures = "0.3"
notify = "8.2.1"
regex = "1.13.1"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sysinfo = "0.36.1"
thiserror.workspace = true
tokio.workspace = true
toml_edit = "0.25.17"
tracing.workspace = true
vca-core.workspace = true

[target."cfg(windows)".dependencies]
# Console input for `vca console-send` (FreeConsole, AttachConsole, CONIN$,
# WriteConsoleInputW; OpenProcess and GetProcessTimes for the target's identity).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
