[project]
name = "vca-stt-server"
version = "0.1.0"
description = "Hardened OpenAI-compatible speech-to-text server (faster-whisper) for Voice Command AI; no weights included"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1,<2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
vca-stt-server = "vca_stt_server.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vca_stt_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
