# Native shells around `apps/ui`. This is a separate Cargo workspace so the
# main workspace (and its CI) does not need the WebView toolchains.
[workspace]
resolver = "3"
members = ["shell", "plugins/vca-mic", "plugins/vca-share", "desktop/src-tauri", "mobile/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/JinsongRoh/Voice-Command-AI"
authors = ["Voice Command AI contributors"]

[workspace.dependencies]
vca-shell = { path = "shell" }
vca-client = { path = "../crates/vca-client" }
vca-core = { path = "../crates/vca-core" }
vca-net = { path = "../crates/vca-net" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-barcode-scanner = "2.5"
tauri-plugin-biometric = "2"
# Pinned: 2.5+ needs Rust 1.90, the workspace builds on 1.85.
tauri-plugin-notification = "=2.4.0"
tauri-plugin-vca-mic = { path = "plugins/vca-mic" }
tauri-plugin-vca-share = { path = "plugins/vca-share" }
tauri-plugin-deep-link = "2.6"
# Desktop "Save as" dialog (`save_file`). Pinned: 2.8+ needs Rust 1.90, the workspace builds on 1.85.
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "2"
# Desktop in-app updates. Pinned: 2.13+ needs Rust 1.90, the workspace builds on 1.85.
tauri-plugin-updater = "=2.12.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
tracing = "0.1"

# iOS release builds: these plugin versions declare their Swift entry point
# (`@_cdecl("init_plugin_*") func initPlugin()`) without `public`, and the
# Swift compiler in current Xcode drops it from optimized builds, so the app
# fails to link. The vendored copies are unchanged except for `public` on that
# one function (tauri-plugin-opener 2.7 has the same fix upstream but needs
# Rust 1.90). Remove a patch when the pinned version includes the fix.
[patch.crates-io]
tauri-plugin-biometric = { path = "vendor/tauri-plugin-biometric" }
tauri-plugin-notification = { path = "vendor/tauri-plugin-notification" }
tauri-plugin-opener = { path = "vendor/tauri-plugin-opener" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
